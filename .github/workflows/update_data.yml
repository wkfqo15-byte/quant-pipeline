name: Daily Quant Data Update

on:
  workflow_dispatch: # 기존의 수동 실행 버튼
  schedule:
    # 매일 한국 시간 아침 9시 (UTC 기준 0시 0분)에 자동 실행
    - cron: '0 0 * * *'
jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 깃허브 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬(3.11) 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 필요 패키지 설치
        run: |
          pip install yfinance pyupbit pandas pyarrow boto3 python-dotenv

      - name: 최신 데이터 수집 및 AWS S3 업로드 실행
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python quant_pipeline/fetch_prices.py